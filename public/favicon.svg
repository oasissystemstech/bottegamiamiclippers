<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 3D Warm Golden Backlight Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Metallic Gold Radiant Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="25%" stop-color="#FFD54F" />
      <stop offset="60%" stop-color="#FFB300" />
      <stop offset="90%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Glossy 3D Black Acrylic Surface -->
    <radialGradient id="glossyDisc" cx="36%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#2D2421" />
      <stop offset="30%" stop-color="#1A1514" />
      <stop offset="70%" stop-color="#0E0B0A" />
      <stop offset="100%" stop-color="#060505" />
    </radialGradient>

    <!-- Outer Rim Illumination -->
    <radialGradient id="haloRim" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#FFD54F" stop-opacity="0.9" />
      <stop offset="94%" stop-color="#FFB300" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FF8F00" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 3D Backlight Halo Glow -->
  <circle cx="256" cy="256" r="240" fill="url(#haloRim)" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="#FFE082" stroke-width="6" opacity="0.75" filter="url(#neonGlow)" />

  <!-- 3D Acrylic Medallion Disc -->
  <circle cx="256" cy="256" r="220" fill="url(#glossyDisc)" stroke="#3E3430" stroke-width="1.5" />

  <!-- Subtle Upper Gloss Reflection -->
  <ellipse cx="256" cy="140" rx="170" ry="70" fill="#FFFFFF" opacity="0.04" />

  <!-- 1. Majestic 5-Point Crown -->
  <g fill="url(#goldMetallic)">
    <path d="M 212 96 L 220 70 L 238 84 L 256 56 L 274 84 L 292 70 L 300 96 Z" />
    <circle cx="220" cy="66" r="3.5" />
    <circle cx="256" cy="52" r="4.5" />
    <circle cx="292" cy="66" r="3.5" />
  </g>

  <!-- 2. Dual Unisex Cameo Silhouettes with Interlocking MC Monogram -->
  <g fill="url(#goldMetallic)">
    <!-- Base Silhouette Cameo -->
    <path d="M 256 102 C 228 102 204 116 198 140 C 195 152 198 162 204 170 C 200 178 200 186 206 194 C 210 200 216 204 220 208 C 222 216 226 224 234 228 C 242 232 250 234 256 234 C 262 234 270 232 278 228 C 286 224 290 216 292 208 C 296 204 302 200 306 194 C 312 186 312 178 308 170 C 314 162 317 152 314 140 C 308 116 284 102 256 102 Z" />
    
    <!-- Cutout MC Lettering in Center of Silhouette -->
    <!-- 'M' and 'C' Monogram -->
    <path d="M 234 134 L 244 168 L 256 148 L 268 168 L 278 134 L 268 134 L 262 152 L 256 140 L 250 152 L 244 134 Z" fill="#14100F" />
    <path d="M 270 172 C 264 166 254 166 248 172 C 242 178 242 190 248 196 C 254 202 264 202 270 196 L 276 202 C 266 212 250 212 240 202 C 230 192 230 176 240 166 C 250 156 266 156 276 166 Z" fill="#14100F" />
  </g>

  <!-- 3. Elegant "Miami Clippers" Calligraphy Script -->
  <!-- Heart Icon on "Miami" -->
  <path d="M 124 286 C 114 274 96 278 96 294 C 96 308 124 326 124 326 C 124 326 152 308 152 294 C 152 278 134 274 124 286 Z" fill="url(#goldMetallic)" transform="translate(30, 20) scale(0.65)" />

  <text x="256" y="306" 
        text-anchor="middle" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="52" 
        font-style="italic" 
        font-weight="bold" 
        letter-spacing="1" 
        fill="url(#goldMetallic)">
    Miami
  </text>

  <!-- Heart Icon on "Clippers" -->
  <path d="M 184 340 C 176 330 162 334 162 346 C 162 358 184 372 184 372 C 184 372 206 358 206 346 C 206 334 192 330 184 340 Z" fill="url(#goldMetallic)" transform="translate(18, 12) scale(0.55)" />

  <text x="256" y="372" 
        text-anchor="middle" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="50" 
        font-style="italic" 
        font-weight="bold" 
        letter-spacing="1" 
        fill="url(#goldMetallic)">
    Clippers
  </text>

  <!-- 4. Subtitle "UNISEX SALON" -->
  <text x="256" y="420" 
        text-anchor="middle" 
        font-family="'DM Sans', -apple-system, sans-serif" 
        font-size="24" 
        font-weight="800" 
        letter-spacing="6" 
        fill="url(#goldMetallic)">
    UNISEX SALON
  </text>

  <!-- Outer Precision Dot Accents -->
  <circle cx="256" cy="442" r="3" fill="url(#goldMetallic)" opacity="0.8" />
  <circle cx="236" cy="442" r="2" fill="url(#goldMetallic)" opacity="0.6" />
  <circle cx="276" cy="442" r="2" fill="url(#goldMetallic)" opacity="0.6" />
</svg>
